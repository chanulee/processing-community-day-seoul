<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCD @ Seoul 2026 — Poster Lab</title>
    <link rel="stylesheet" href="app/style.css" />
    <script>
      window.__errors = [];
      addEventListener('error', (e) => __errors.push(String((e.error && e.error.stack) || e.message)));
      addEventListener('unhandledrejection', (e) => __errors.push(String(e.reason && e.reason.stack || e.reason)));
    </script>
    <script src="vendor/p5.min.js"></script>
    <script src="vendor/gsap.min.js"></script>
  </head>
  <body>
    <div class="app">
      <main class="stage" id="stage">
        <div class="frame" id="frame">
          <div id="canvas-holder"></div>
        </div>
        <div class="stage-meta">
          <span id="meta-size">A2 · 420 × 594 mm</span>
          <span id="meta-fps"></span>
        </div>
      </main>

      <aside class="panel" aria-label="Poster parameters">
        <header class="panel-head">
          <div class="brand">PCD @ Seoul 2026 <span>Poster Lab</span></div>
          <nav class="exp-list" id="exp-list" aria-label="Experiments"></nav>
        </header>

        <section class="card">
          <h1 id="exp-title"></h1>
          <p class="exp-desc" id="exp-desc"></p>
          <div class="row-buttons">
            <button class="btn" id="btn-play" title="Space">Pause</button>
            <button class="btn" id="btn-png" title="S">PNG</button>
            <button class="btn" id="btn-rec" title="Record WebM">● Rec</button>
          </div>
          <div class="control" data-global>
            <div class="label"><span>Speed</span><span class="value" id="speed-val">1.00×</span></div>
            <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
          </div>
          <div class="control" data-global>
            <div class="label"><span>Export density</span><span class="value" id="density-val">1×</span></div>
            <input type="range" id="density" min="1" max="3" step="1" value="1" />
          </div>
        </section>

        <section class="card" id="params"></section>

        <section class="card actions">
          <div class="row-buttons">
            <button class="btn primary" id="btn-random" title="R">Randomize</button>
            <button class="btn" id="btn-reset">Reset</button>
          </div>
          <button class="btn ghost" id="btn-copy">Copy params JSON</button>
          <p class="hint">Space 재생/정지 · S PNG · R 랜덤 · ← → 실험 전환</p>
        </section>
      </aside>
    </div>
    <script type="module" src="app/shell.js"></script>
  </body>
</html>
